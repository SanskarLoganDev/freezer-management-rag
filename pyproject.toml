[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "freezer-management-rag"
version = "0.1.0"
description = "Local document RAG for the Virtual Laboratory Freezer Management System"
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[project.scripts]
freezer-rag = "freezer_rag.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1.0"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
freezer_rag = ["generation/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
