        },
        "freezer_code": {
          "type": "string",
          "title": "Freezer Code"
        },
        "components": {
          "items": {
            "$ref": "#/components/schemas/StoragePathComponent"
          },
          "type": "array",
          "title": "Components"
        },
        "full_path": {
          "type": "string",
          "title": "Full Path",
          "description": "Site, address, building, floor, room, freezer code and all hierarchy labels."
