      },
      "type": "object",
      "required": [
        "site_name",
        "address",
        "building",
        "floor",
        "room",
        "freezer_id",
        "freezer_code",
        "components",
        "full_path"
      ],
      "title": "StoragePath",
      "description": "Expose a complete, authorized physical address and outer-to-inner hierarchy.\n\nThe same shape describes occupied locations and suggested/reserved destinations;\nenclosing response fields distinguish their different meanings."
    },
    "StoragePathComponent": {
      "properties": {
        "location_id": {
          "type": "string",
          "format": "uuid",
          "title": "Location Id"
        },
        "type": {
          "type": "string",
          "title": "Type"
        },
        "label": {
          "type": "string",
          "title": "Label"
        }
      },
      "type": "object",
      "required": [
        "location_id",
        "type",
        "label"
      ],
      "title": "StoragePathComponent",
      "description": "Identify one ordered hierarchy node for navigation through custom freezer layouts.\n\nNode IDs and labels preserve a variable shelf/rack/box/slot structure without\nforcing clients to assume a fixed depth."
    },
    "TemperatureRange": {
      "properties": {
        "min": {
          "type": "number",
          "maximum": 100.0,
          "minimum": -273.15,
          "title": "Min"
