        "max": {
          "type": "number",
          "maximum": 100.0,
          "minimum": -273.15,
          "title": "Max"
        }
      },
      "additionalProperties": false,
      "type": "object",
      "required": [
        "min",
        "max"
      ],
      "title": "TemperatureRange",
      "description": "Validate Celsius lower and upper bounds, including the physical absolute-zero limit.\n\nA reusable range contract keeps freezer responses and request validation consistent\nbefore database-dependent compatibility rules run."
    },
    "ToolRequest": {
      "properties": {
