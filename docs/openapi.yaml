# Business interfaces only; generated from FastAPI metadata without server startup.
openapi: "3.1.0"

info: {
  "title": "Virtual Laboratory Freezer Management Business API",
  "version": "0.5.0",
  "description": "Implemented business contract aligned with Software Design Document section 3.6. Core owns permissions, transactions and activity; the separate Claude Agent uses controlled Core HTTP calls. Recommendations hold no space; 15-minute proposals require exact explicit confirmation for a 48-hour reservation; check-in records physical storage. Local authentication/account setup, health checks, manual expiration testing and synthetic-image delivery are excluded. Organizational SSO, general external-client identity and independent machine confirmation remain deferred. Runtime service /openapi.json documents the complete executable local interface."
}

