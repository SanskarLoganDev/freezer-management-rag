  },
  "securitySchemes": {
    "HTTPBearer": {
      "type": "http",
      "scheme": "bearer",
      "description": "Verified real user context; Core independently checks current project/resource permissions."
    },
    "AgentServiceKey": {
      "type": "apiKey",
      "in": "header",
      "name": "X-Agent-Service-Key",
      "description": "Agent service authority, required together with the real user's bearer. Grants no administrator identity."
    },
    "SchedulerServiceKey": {
      "type": "apiKey",
      "in": "header",
      "name": "X-Scheduler-Service-Key",
      "description": "Independent scheduler authority for expiration only; user bearers and Agent keys cannot substitute."
    }
  }
}

