          "maxLength": 80,
          "minLength": 1,
          "title": "Name"
        },
        "arguments": {
          "additionalProperties": true,
          "type": "object",
          "title": "Arguments",
          "description": "Core validates arguments against the selected tool schema."
        }
      },
      "additionalProperties": false,
      "type": "object",
      "required": [
        "request_id",
        "step",
        "name",
        "arguments"
      ],
      "title": "ToolRequest",
      "description": "Identify an allowlisted tool step in a live durable turn, without caller identity."
