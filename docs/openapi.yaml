          "anyOf": [
            {
              "$ref": "#/components/schemas/StartingLocation"
            },
            {
              "type": "null"
            }
          ],
          "description": "Optional hierarchy prefix for proximity ranking; no walking distance is calculated."
        },
        "limit": {
          "type": "integer",
          "maximum": 100.0,
          "minimum": 1.0,
          "title": "Limit",
          "description": "Maximum suggestions after compatibility filtering and proximity ranking.",
          "default": 10
        }
      },
      "additionalProperties": false,
      "type": "object",
      "required": [
        "project_id",
        "material_type",
        "dimensions_mm",
        "required_temperature_c"
      ],
      "title": "StorageMatchRequest",
      "description": "Validate item requirements for a read-only, authenticated matching query.\n\nNo caller identity or confirmation is accepted from JSON. Requirements may describe\na new item; returned candidates remain advisory until a later confirmed transaction."
    },
    "StorageMatchResponse": {
      "properties": {
        "matches": {
          "items": {
            "$ref": "#/components/schemas/StorageMatch"
          },
          "type": "array",
          "title": "Matches"
        }
      },
      "type": "object",
      "required": [
        "matches"
      ],
      "title": "StorageMatchResponse",
      "description": "Wrap ranked advisory options, including an empty list when none qualify.\n\nEmpty matches are a successful compatibility search, not an allocation failure."
    },
    "StoragePath": {
      "properties": {
        "site_name": {
          "type": "string",
          "title": "Site Name"
        },
        "address": {
          "type": "string",
          "title": "Address"
        },
        "building": {
          "type": "string",
          "title": "Building"
        },
        "floor": {
          "type": "string",
          "title": "Floor"
        },
        "room": {
          "type": "string",
          "title": "Room"
